<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opening Squeez...</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont,
          'Segoe UI', sans-serif;
      background: #FFFBF0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .container {
      text-align: center;
      padding: 40px 24px;
    }
    img {
      width: 140px;
      margin-bottom: 24px;
    }
    p {
      color: #8A5200;
      font-size: 16px;
    }
    #debug {
      font-size: 12px;
      color: #C4610A;
      word-break: break-all;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div class="container">
    <img 
      src="https://monliopueoanzquualme.supabase.co/storage/v1/object/public/Assets/App%20Horizontal%20Logo.png" 
      alt="Squeez"
    />
    <p>Opening Squeez...</p>
    <p id="debug"></p>
  </div>
  <script>
    (function() {
      // Show full URL for debugging
      document.getElementById('debug')
          .textContent = 
          'URL: ' + window.location.href;

      // Parse both query params and fragment
      const search = window.location.search;
      const hash = window.location.hash
          .substring(1);
      
      const queryParams = 
          new URLSearchParams(search);
      const fragmentParams = 
          new URLSearchParams(hash);

      // Get token_hash
      const tokenHash = 
          queryParams.get('token_hash') ||
          fragmentParams.get('token_hash');

      // Get type
      const type = 
          queryParams.get('type') ||
          fragmentParams.get('type') ||
          'email_change';

      // Get access_token (implicit fallback)
      const accessToken = 
          fragmentParams.get('access_token');
      const refreshToken = 
          fragmentParams.get('refresh_token');

      let appUrl;

      if (tokenHash) {
        appUrl = 'squeez://callback'
            + '?token_hash=' + tokenHash
            + '&type=' + type;
      } else if (accessToken) {
        appUrl = 'squeez://callback#'
            + 'access_token=' + accessToken
            + '&refresh_token=' + refreshToken
            + '&type=' + type;
      } else {
        appUrl = 'squeez://callback';
      }

      // 5 second delay for debugging
      setTimeout(function() {
        window.location.href = appUrl;
      }, 5000);
    })();
  </script>
</body>
</html>
